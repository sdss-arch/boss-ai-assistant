<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="BOSS AI Assistant banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <ellipse cx="330" cy="320" rx="330" ry="300" fill="url(#glow)"/>
  <circle cx="1180" cy="520" r="220" fill="#7c3aed" opacity="0.10" filter="url(#blur)"/>

  <!-- 抽象：对话气泡 + 神经网络节点 + 公文包轮廓 -->
  <g transform="translate(120 132)">
    <rect x="0" y="0" width="356" height="300" rx="52" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M56 66a26 26 0 0 1 26-26h192a26 26 0 0 1 26 26v118a26 26 0 0 1-26 26h-102l-52 42v-42h-38a26 26 0 0 1-26-26V66Z" fill="url(#accent)" fill-opacity="0.14" stroke="url(#accent)" stroke-width="4"/>
    <g stroke="#93c5fd" stroke-opacity="0.75" stroke-width="3" fill="none">
      <path d="M104 118L166 92L228 134L280 100"/>
      <path d="M104 118L160 172L228 134"/>
      <path d="M160 172L214 206L280 178"/>
    </g>
    <g fill="#e0e7ff">
      <circle cx="104" cy="118" r="10"/><circle cx="166" cy="92" r="13"/>
      <circle cx="228" cy="134" r="11"/><circle cx="280" cy="100" r="8"/>
      <circle cx="160" cy="172" r="9"/><circle cx="214" cy="206" r="7"/>
      <circle cx="280" cy="178" r="12"/>
    </g>
    <g transform="translate(112 232)" fill="none" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="5">
      <rect x="0" y="16" width="130" height="78" rx="14"/>
      <path d="M42 16V8a12 12 0 0 1 12-12h34a12 12 0 0 1 12 12v8M0 46h130"/>
    </g>
  </g>

  <!-- 标题 -->
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="620" y="250" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="2">BOSS AI 助手</text>
    <text x="624" y="322" fill="#bfdbfe" font-size="30" font-weight="500">多智能体求职辅助桌面应用</text>
    <text x="624" y="372" fill="#94a3b8" font-size="22">招呼语 · 回复 · 面试 · 岗位匹配 · 公司尽调 · 网页助手</text>
    <g transform="translate(624 420)">
      <rect x="0" y="-30" width="182" height="48" rx="24" fill="url(#accent)" fill-opacity="0.18" stroke="#93c5fd" stroke-opacity="0.5"/>
      <text x="91" y="2" fill="#dbeafe" font-size="21" text-anchor="middle">Electron · Multi-Agent</text>
    </g>
  </g>

  <path d="M620 500H1470" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <text x="624" y="542" fill="#64748b" font-size="18" font-family="monospace">github.com/sdss-arch/boss-ai-assistant</text>
</svg>
