name: 功能建议
description: 提出新功能或改进现有能力
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 说明使用场景与当前痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望的应用行为或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: scope
    attributes:
      label: 可能影响的范围
      description: 例如：需要新增 Agent、改动 IPC、影响移动端适配等
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 该功能不涉及自动发送消息或绕过平台风控
          required: true
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
