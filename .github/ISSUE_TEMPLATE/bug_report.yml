name: Bug 反馈
description: 报告功能异常、界面问题或采集失效
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴 API Key、真实简历、聊天记录或登录凭据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰地描述发生了什么
      placeholder: 例如：点击「生成招呼语」后面板无响应
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按步骤描述，便于我们复现
      placeholder: |
        1. 打开 BOSS 职位详情页
        2. 点击面板「助手」
        3. 点击「招呼语」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可附上控制台日志或截图（请先打码个人信息）
      render: shell
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 我已移除日志与截图中的敏感信息
          required: true
